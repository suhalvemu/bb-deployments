apiVersion: v1
kind: Service
metadata:
  name: storage
  namespace: {{ include "buildbarn.namespace" . }}
  labels:
    {{- include "buildbarn.labels" . | nindent 4 }}
  annotations:
    prometheus.io/port: "80"
    prometheus.io/scrape: "true"
spec:
  clusterIP: None
  ports:
  - port: 8981
    protocol: TCP
    name: grpc
  selector:
    {{- include "buildbarn.selectorLabels" (dict "root" $ "component" "storage") | nindent 4 }}
