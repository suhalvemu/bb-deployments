# Default values for the buildbarn chart.

namespace:
  # If true, the chart creates the namespace itself. Set to false if you
  # manage the namespace externally (e.g. via a separate Terraform/GitOps
  # resource) and just want to install into an existing one.
  create: true
  name: buildbarn

global:
  # Matches common.libsonnet's `maximumMessageSizeBytes` — the largest
  # single gRPC message Buildbarn components will accept.
  maximumMessageSizeBytes: 16777216 # 16 MiB

image:
  repository: ghcr.io/buildbarn/bb-storage
  tag: "20260609T094425Z-10acc76"
  pullPolicy: IfNotPresent

storage:
  replicas: 2

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

  # Storage class for the PVCs below. Leave empty to use the cluster
  # default (what `kind` uses for local testing). Set explicitly for
  # cloud deployments, e.g. "gp3" on EKS or "premium-rwo" on GKE.
  storageClassName: ""

  cas:
    pvcSizeGi: 33
    blockSizeBytes: 34359738368 # 32 GiB, must stay <= pvcSizeGi
    keyLocationMapSizeBytes: 419430400 # 400 MiB
  ac:
    pvcSizeGi: 1
    blockSizeBytes: 20971520 # 20 MiB
    keyLocationMapSizeBytes: 1048576 # 1 MiB
  fsac:
    pvcSizeGi: 1
    blockSizeBytes: 20971520 # 20 MiB
    keyLocationMapSizeBytes: 1048576 # 1 MiB

  # Buildbarn's own images don't bundle grpc_health_probe, so probes use a
  # plain TCP check against the gRPC listen port rather than an actual gRPC
  # health check. Good enough to catch "process is up and listening" —
  # swap to grpcSocket-based probes if a build variant adds the probe binary.
  probes:
    enabled: true
    port: 8981
    initialDelaySeconds: 5
    periodSeconds: 10

frontend:
  # Stateless — runs the same bb-storage image, just pointed at
  # frontend.jsonnet instead of storage.jsonnet, so it uses the top-level
  # `image` block above rather than its own.
  replicas: 3

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

  probes:
    enabled: true
    port: 8980
    initialDelaySeconds: 5
    periodSeconds: 10

  service:
    # LoadBalancer matches upstream's raw manifest (external entrypoint for
    # Bazel clients). On kind this stays Pending forever with no cloud
    # LB controller — fine for verifying the Deployment itself; switch to
    # NodePort or port-forward to actually reach it locally.
    type: LoadBalancer

scheduler:
  # Its own image — bb-scheduler is a separate binary from bb-storage,
  # unlike frontend which just reuses the storage image with a different
  # config.
  image:
    repository: ghcr.io/buildbarn/bb-scheduler
    tag: "20260527T162223Z-c48dcda"
    pullPolicy: IfNotPresent

  replicas: 1

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

  # The scheduler exposes readiness via its admin HTTP port rather than
  # the gRPC ports — a plain TCP check against 7982 is enough to confirm
  # the process is up and serving.
  probes:
    enabled: true
    port: 7982
    initialDelaySeconds: 5
    periodSeconds: 10

  ingress:
    # Off by default — upstream's raw manifest hardcodes
    # bb-scheduler.example.com, which isn't meaningful outside their own
    # docs setup. Set enabled=true and pick a real host + ingressClassName
    # for an actual cluster.
    enabled: false
    host: bb-scheduler.example.com
    ingressClassName: ""
