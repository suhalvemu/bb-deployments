apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ include "buildbarn.namespace" . }}
  labels:
    {{- include "buildbarn.labels" . | nindent 4 }}
  annotations:
    prometheus.io/port: "80"
    prometheus.io/scrape: "true"
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
  - port: 8980
    protocol: TCP
    name: grpc
  selector:
    {{- include "buildbarn.selectorLabels" (dict "root" $ "component" "frontend") | nindent 4 }}
