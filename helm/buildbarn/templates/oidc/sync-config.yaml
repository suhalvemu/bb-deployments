{{- if .Values.oidc.enabled }}
# Hooked at the same weight as the RBAC resources -- both need to exist
# before the bootstrap Job hook (weight -5) runs, and this ConfigMap is
# also reused by the ongoing CronJob (a regular, non-hook resource).
apiVersion: v1
kind: ConfigMap
metadata:
  name: jwks-sync-config
  namespace: {{ include "buildbarn.namespace" . }}
  labels:
    {{- include "buildbarn.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  sync_jwks_to_configmap.jsonnet: |
    {
      httpClient: {},
      jwksUrl: '{{ .Values.oidc.jwksUrl }}',
      configMapNamespace: '{{ include "buildbarn.namespace" . }}',
      configMapName: '{{ include "buildbarn.jwksConfigMapName" . }}',
      configMapKey: 'jwks.json',
    }
{{- end }}
