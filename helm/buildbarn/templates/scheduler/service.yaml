apiVersion: v1
kind: Service
metadata:
  name: scheduler
  namespace: {{ include "buildbarn.namespace" . }}
  labels:
    {{- include "buildbarn.labels" . | nindent 4 }}
  annotations:
    prometheus.io/port: "80"
    prometheus.io/scrape: "true"
spec:
  type: ClusterIP
  ports:
  - port: 8982
    protocol: TCP
    name: client-grpc
  - port: 8983
    protocol: TCP
    name: worker-grpc
  - port: 8984
    protocol: TCP
    name: queue-state
  - port: 7982
    protocol: TCP
    name: http
  selector:
    {{- include "buildbarn.selectorLabels" (dict "root" $ "component" "scheduler") | nindent 4 }}
