apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: {{ include "buildbarn.namespace" . }}
  labels:
    {{- include "buildbarn.labels" . | nindent 4 }}
    {{- include "buildbarn.selectorLabels" (dict "root" $ "component" "portal") | nindent 4 }}
spec:
  replicas: {{ .Values.portal.replicas }}
  selector:
    matchLabels:
      {{- include "buildbarn.selectorLabels" (dict "root" $ "component" "portal") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "buildbarn.selectorLabels" (dict "root" $ "component" "portal") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.portal.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.portal.securityContext.runAsUser }}
        runAsGroup: {{ .Values.portal.securityContext.runAsGroup }}
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.31.1-uclibc
        # bb-portal crashes fatally (not just retries) if postgres isn't
        # reachable the moment it starts its DB schema migration, and
        # Kubernetes gives no ordering guarantee across separate
        # workloads -- confirmed via a from-scratch install where portal
        # crash-looped 3-4 times before postgres won the race. Gate on
        # postgres actually being reachable instead of relying on
        # restarts to eventually catch up.
        command:
        - sh
        - -c
        - until nc -z postgres.{{ include "buildbarn.namespace" . }} 5432; do echo "waiting for postgres..."; sleep 2; done
      containers:
      - name: portal
        image: "{{ .Values.portal.image.repository }}:{{ .Values.portal.image.tag }}"
        imagePullPolicy: {{ .Values.portal.image.pullPolicy }}
        args:
        - /config/portal.jsonnet
        securityContext:
          allowPrivilegeEscalation: {{ .Values.portal.securityContext.allowPrivilegeEscalation }}
          readOnlyRootFilesystem: {{ .Values.portal.securityContext.readOnlyRootFilesystem }}
        ports:
        - containerPort: 8081
          protocol: TCP
          name: http
        - containerPort: 8082
          protocol: TCP
          name: bes-grpc
        - containerPort: 9980
          protocol: TCP
          name: diagnostics
        resources:
          {{- toYaml .Values.portal.resources | nindent 10 }}
        {{- if .Values.portal.probes.enabled }}
        readinessProbe:
          tcpSocket:
            port: {{ .Values.portal.probes.port }}
          initialDelaySeconds: {{ .Values.portal.probes.initialDelaySeconds }}
          periodSeconds: {{ .Values.portal.probes.periodSeconds }}
        livenessProbe:
          tcpSocket:
            port: {{ .Values.portal.probes.port }}
          initialDelaySeconds: {{ .Values.portal.probes.initialDelaySeconds }}
          periodSeconds: {{ .Values.portal.probes.periodSeconds }}
        {{- end }}
        volumeMounts:
        - mountPath: /config/
          name: configs
          readOnly: true
      volumes:
      - name: configs
        configMap:
          name: buildbarn-config
          items:
          - key: common.libsonnet
            path: common.libsonnet
          - key: portal.jsonnet
            path: portal.jsonnet
