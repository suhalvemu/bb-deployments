apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: {{ include "buildbarn.namespace" . }}
  labels:
    {{- include "buildbarn.labels" . | nindent 4 }}
  annotations:
    prometheus.io/port: "80"
    prometheus.io/scrape: "true"
spec:
  ports:
  - port: 8081
    protocol: TCP
    name: http
  selector:
    {{- include "buildbarn.selectorLabels" (dict "root" $ "component" "portal") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: portal-bes
  namespace: {{ include "buildbarn.namespace" . }}
  labels:
    {{- include "buildbarn.labels" . | nindent 4 }}
spec:
  type: {{ .Values.portal.service.besType }}
  ports:
  - port: 8082
    protocol: TCP
    name: bes-grpc
  selector:
    {{- include "buildbarn.selectorLabels" (dict "root" $ "component" "portal") | nindent 4 }}
