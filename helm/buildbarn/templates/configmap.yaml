apiVersion: v1
kind: ConfigMap
metadata:
  name: buildbarn-config
  namespace: {{ include "buildbarn.namespace" . }}
  labels:
    {{- include "buildbarn.labels" . | nindent 4 }}
data:
  common.libsonnet: |
    {
      blobstore: {
        contentAddressableStorage: {
          sharding: {
            shards: {{ include "buildbarn.storageShards" . | nindent 12 }},
          },
        },
        actionCache: {
          completenessChecking: {
            backend: {
              sharding: {
                shards: {{ include "buildbarn.storageShards" . | nindent 16 }},
              },
            },
            maximumTotalTreeSizeBytes: 64 * 1024 * 1024,
          },
        },
      },
      fileSystemAccessCache: {
        sharding: {
          shards: {{ include "buildbarn.storageShards" . | nindent 10 }},
        },
      },
      initialSizeClassCache: {
        sharding: {
          shards: {{ include "buildbarn.storageShards" . | nindent 10 }},
        },
      },
      browserUrl: 'http://bb-portal.example.com:80/browser',
      maximumMessageSizeBytes: {{ .Values.global.maximumMessageSizeBytes | int64 }},
      global: {
        diagnosticsHttpServer: {
          httpServers: [{
            listenAddresses: [':9980'],
            authenticationPolicy: { allow: {} },
          }],
          enablePrometheus: true,
          enablePprof: true,
          enableActiveSpans: true,
        },
      },
    }
  storage.jsonnet: |
    local common = import 'common.libsonnet';

    {
      grpcServers: [{
        listenAddresses: [':8981'],
        authenticationPolicy: {{ include "buildbarn.authenticationPolicy" $ }},
      }],
      maximumMessageSizeBytes: common.maximumMessageSizeBytes,
      global: common.global,
      contentAddressableStorage: {
        backend: {
          'local': {
            keyLocationMapOnBlockDevice: {
              file: {
                path: '/storage-cas/key_location_map',
                sizeBytes: {{ .Values.storage.cas.keyLocationMapSizeBytes | int64 }},
              },
            },
            keyLocationMapMaximumGetAttempts: 16,
            keyLocationMapMaximumPutAttempts: 64,
            oldBlocks: 8,
            currentBlocks: 24,
            newBlocks: 3,
            blocksOnBlockDevice: {
              source: {
                file: {
                  path: '/storage-cas/blocks',
                  sizeBytes: {{ .Values.storage.cas.blockSizeBytes | int64 }},
                },
              },
              spareBlocks: 3,
            },
            persistent: {
              stateDirectoryPath: '/storage-cas/persistent_state',
              minimumEpochInterval: '300s',
            },
          },
        },
        getAuthorizer: { allow: {} },
        putAuthorizer: { allow: {} },
        findMissingAuthorizer: { allow: {} },
      },
      actionCache: {
        backend: {
          'local': {
            keyLocationMapOnBlockDevice: {
              file: {
                path: '/storage-ac/key_location_map',
                sizeBytes: {{ .Values.storage.ac.keyLocationMapSizeBytes | int64 }},
              },
            },
            keyLocationMapMaximumGetAttempts: 16,
            keyLocationMapMaximumPutAttempts: 64,
            oldBlocks: 8,
            currentBlocks: 24,
            newBlocks: 1,
            blocksOnBlockDevice: {
              source: {
                file: {
                  path: '/storage-ac/blocks',
                  sizeBytes: {{ .Values.storage.ac.blockSizeBytes | int64 }},
                },
              },
              spareBlocks: 3,
            },
            persistent: {
              stateDirectoryPath: '/storage-ac/persistent_state',
              minimumEpochInterval: '300s',
            },
          },
        },
        getAuthorizer: { allow: {} },
        putAuthorizer: { allow: {} },
      },
      fileSystemAccessCache: {
        backend: {
          'local': {
            keyLocationMapOnBlockDevice: {
              file: {
                path: '/storage-fsac/key_location_map',
                sizeBytes: {{ .Values.storage.fsac.keyLocationMapSizeBytes | int64 }},
              },
            },
            keyLocationMapMaximumGetAttempts: 16,
            keyLocationMapMaximumPutAttempts: 64,
            oldBlocks: 8,
            currentBlocks: 24,
            newBlocks: 1,
            blocksOnBlockDevice: {
              source: {
                file: {
                  path: '/storage-fsac/blocks',
                  sizeBytes: {{ .Values.storage.fsac.blockSizeBytes | int64 }},
                },
              },
              spareBlocks: 3,
            },
            persistent: {
              stateDirectoryPath: '/storage-fsac/persistent_state',
              minimumEpochInterval: '300s',
            },
          },
        },
        getAuthorizer: { allow: {} },
        putAuthorizer: { allow: {} },
      },
    }
  frontend.jsonnet: |
    local common = import 'common.libsonnet';

    {
      grpcServers: [{
        listenAddresses: [':8980'],
        authenticationPolicy: {{ include "buildbarn.authenticationPolicy" $ }},
      }],
      schedulers: {
        '': {
          endpoint: {
            address: 'scheduler:8982',
            addMetadataJmespathExpression: {
              expression: |||
                {
                  "build.bazel.remote.execution.v2.requestmetadata-bin": incomingGRPCMetadata."build.bazel.remote.execution.v2.requestmetadata-bin"
                }
              |||,
            },
          },
        },
      },
      maximumMessageSizeBytes: common.maximumMessageSizeBytes,
      global: common.global,
      contentAddressableStorage: {
        backend: common.blobstore.contentAddressableStorage,
        getAuthorizer: { allow: {} },
        putAuthorizer: { allow: {} },
        findMissingAuthorizer: { allow: {} },
      },
      actionCache: {
        backend: common.blobstore.actionCache,
        getAuthorizer: { allow: {} },
        putAuthorizer: { allow: {} },
      },
      fileSystemAccessCache: {
        backend: common.fileSystemAccessCache,
        getAuthorizer: { allow: {} },
        putAuthorizer: { allow: {} },
      },
      executeAuthorizer: { allow: {} },
    }
  scheduler.jsonnet: |
    local common = import 'common.libsonnet';

    {
      adminHttpServers: [{
        listenAddresses: [':7982'],
        authenticationPolicy: {{ include "buildbarn.authenticationPolicy" $ }},
      }],
      clientGrpcServers: [{
        listenAddresses: [':8982'],
        authenticationPolicy: {{ include "buildbarn.authenticationPolicy" $ }},
      }],
      // Intentionally always allow: {} regardless of oidc.enabled -- this is
      // where worker pods register themselves, machine-to-machine, from
      // inside the cluster. They have no OIDC identity/token to present;
      // treat this as internal-only traffic, restricted via NetworkPolicy
      // rather than user-facing JWT auth if isolation is needed.
      workerGrpcServers: [{
        listenAddresses: [':8983'],
        authenticationPolicy: { allow: {} },
      }],
      buildQueueStateGrpcServers: [{
        listenAddresses: [':8984'],
        authenticationPolicy: {{ include "buildbarn.authenticationPolicy" $ }},
      }],
      browserUrl: common.browserUrl,
      contentAddressableStorage: common.blobstore.contentAddressableStorage,
      maximumMessageSizeBytes: common.maximumMessageSizeBytes,
      global: common.global,
      executeAuthorizer: { allow: {} },
      modifyDrainsAuthorizer: { allow: {} },
      killOperationsAuthorizer: { allow: {} },
      synchronizeAuthorizer: { allow: {} },
      actionRouter: {
        simple: {
          platformKeyExtractor: { action: {} },
          invocationKeyExtractors: [
            { correlatedInvocationsId: {} },
            { toolInvocationId: {} },
          ],
          initialSizeClassAnalyzer: {
            defaultExecutionTimeout: '1800s',
            maximumExecutionTimeout: '7200s',
          },
        },
      },
      platformQueueWithNoWorkersTimeout: '900s',
    }
  worker-ubuntu22-04.jsonnet: |
    local common = import 'common.libsonnet';

    {
      blobstore: common.blobstore,
      browserUrl: common.browserUrl,
      maximumMessageSizeBytes: common.maximumMessageSizeBytes,
      scheduler: { address: 'scheduler:8983' },
      global: common.global {
        setUmask: { umask: 0 },
      },
      buildDirectories: [{
        native: {
          buildDirectoryPath: '/worker/build',
          cacheDirectoryPath: '/worker/cache',
          maximumCacheFileCount: {{ .Values.worker.cache.maximumFileCount | int64 }},
          maximumCacheSizeBytes: {{ .Values.worker.cache.maximumSizeBytes | int64 }},
          cacheReplacementPolicy: 'LEAST_RECENTLY_USED',
        },
        runners: [{
          endpoint: { address: 'unix:///worker/runner' },
          concurrency: {{ .Values.worker.concurrency | int64 }},
          platform: {
            properties: [
              { name: 'OSFamily', value: 'linux' },
              { name: 'container-image', value: 'docker://{{ .Values.worker.runner.image.repository }}:{{ .Values.worker.runner.image.tag }}' },
            ],
          },
          workerId: {
            pod: std.extVar('POD_NAME'),
            node: std.extVar('NODE_NAME'),
          },
        }],
      }],
      inputDownloadConcurrency: {{ .Values.worker.inputDownloadConcurrency | int64 }},
      outputUploadConcurrency: {{ .Values.worker.outputUploadConcurrency | int64 }},
      directoryCache: {
        maximumCount: 1000,
        maximumSizeBytes: 1000 * 1024,
        cacheReplacementPolicy: 'LEAST_RECENTLY_USED',
      },
    }
  runner-ubuntu22-04.jsonnet: |
    local common = import 'common.libsonnet';

    {
      buildDirectoryPath: '/worker/build',
      // TODO: global: common.global,
      grpcServers: [{
        listenPaths: ['/worker/runner'],
        authenticationPolicy: { allow: {} },
      }],
    }
  portal.jsonnet: |
    local common = import 'common.libsonnet';

    {
      global: common.global,
      httpServers: [{
        listenAddresses: [':8081'],
        authenticationPolicy: {{ include "buildbarn.authenticationPolicy" $ }},
      }],
      instanceNameAuthorizer: {
        allow: {},
      },
      maximumMessageSizeBytes: common.maximumMessageSizeBytes,
      besServiceConfiguration: {
        grpcServers: [{
          listenAddresses: [':8082'],
          authenticationPolicy: {{ include "buildbarn.authenticationPolicy" $ }},
          maximumReceivedMessageSizeBytes: 10 * 1024 * 1024,
        }],
        database: {
          postgres: {
            connectionString: 'postgresql://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres.{{ include "buildbarn.namespace" . }}:5432/{{ .Values.postgres.database }}',
          },
          connectionPoolConfiguration: {
            maxOpenConnections: 10,
            maxIdleConnections: 10,
            connectionMaxLifetime: '120s',
            connectionMaxIdleTime: '30s',
          },
        },
        enableBepFileUpload: true,
        enableGraphqlPlayground: true,
        saveDataLevel: { basicAndTarget: {} },
        databaseCleanupConfiguration: {
          cleanupInterval: '60s',
          invocationMessageTimeout: '3600s',
          invocationRetention: '604800s',
        },
        minEventBatchDuration: '0.1s',
        buildKey: 'build_id',
      },
      contentAddressableStorage: common.blobstore.contentAddressableStorage,
      actionCache: common.blobstore.actionCache,
      initialSizeClassCache: common.initialSizeClassCache,
      fileSystemAccessCache: common.fileSystemAccessCache,
      schedulerServiceConfiguration: {
        buildQueueStateClient: {
          address: 'scheduler:8984',
        },
        killOperationsAuthorizer: {
          allow: {},
        },
        listOperationsPageSize: 500,
      },
      frontendServiceConfiguration: {
        frontendSource: {
          embedded: {},
        },
        frontendConfig: {
          companyName: {{ .Values.portal.companyName | quote }},
          grpcBackendUrl: 'grpc://localhost:8082',
          featureFlags: {
            home: {
              fileUpload: {},
              instructions: {},
            },
            bes: {
              pageBuilds: {},
              pageInvocations: {},
              pageTargets: {},
              pageTests: {},
              pageTrends: {},
            },
            browser: {},
            scheduler: {},
          },
          footerContent: [
            {
              text: 'Buildteam',
              href: 'https://buildteamworld.slack.com/archives/CD6HZC750',
              icon: { slack: {} },
            },
          ],
        },
      },
    }
