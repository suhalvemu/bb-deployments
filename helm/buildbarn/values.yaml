# Default values for the buildbarn chart.

namespace:
  # If true, the chart creates the namespace itself. Set to false if you
  # manage the namespace externally (e.g. via a separate Terraform/GitOps
  # resource) and just want to install into an existing one.
  create: true
  name: buildbarn

global:
  # Matches common.libsonnet's `maximumMessageSizeBytes` — the largest
  # single gRPC message Buildbarn components will accept.
  maximumMessageSizeBytes: 16777216 # 16 MiB

image:
  repository: ghcr.io/buildbarn/bb-storage
  tag: "20260609T094425Z-10acc76"
  pullPolicy: IfNotPresent

storage:
  replicas: 2

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

  # Storage class for the PVCs below. Leave empty to use the cluster
  # default (what `kind` uses for local testing). Set explicitly for
  # cloud deployments, e.g. "gp3" on EKS or "premium-rwo" on GKE.
  storageClassName: ""

  cas:
    pvcSizeGi: 33
    blockSizeBytes: 34359738368 # 32 GiB, must stay <= pvcSizeGi
    keyLocationMapSizeBytes: 419430400 # 400 MiB
  ac:
    pvcSizeGi: 1
    blockSizeBytes: 20971520 # 20 MiB
    keyLocationMapSizeBytes: 1048576 # 1 MiB
  fsac:
    pvcSizeGi: 1
    blockSizeBytes: 20971520 # 20 MiB
    keyLocationMapSizeBytes: 1048576 # 1 MiB

  # Buildbarn's own images don't bundle grpc_health_probe, so probes use a
  # plain TCP check against the gRPC listen port rather than an actual gRPC
  # health check. Good enough to catch "process is up and listening" —
  # swap to grpcSocket-based probes if a build variant adds the probe binary.
  probes:
    enabled: true
    port: 8981
    initialDelaySeconds: 5
    periodSeconds: 10

frontend:
  # Stateless — runs the same bb-storage image, just pointed at
  # frontend.jsonnet instead of storage.jsonnet, so it uses the top-level
  # `image` block above rather than its own.
  replicas: 3

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

  probes:
    enabled: true
    port: 8980
    initialDelaySeconds: 5
    periodSeconds: 10

  service:
    # LoadBalancer matches upstream's raw manifest (external entrypoint for
    # Bazel clients). On kind this stays Pending forever with no cloud
    # LB controller — fine for verifying the Deployment itself; switch to
    # NodePort or port-forward to actually reach it locally.
    type: LoadBalancer

scheduler:
  # Its own image — bb-scheduler is a separate binary from bb-storage,
  # unlike frontend which just reuses the storage image with a different
  # config.
  image:
    repository: ghcr.io/buildbarn/bb-scheduler
    tag: "20260527T162223Z-c48dcda"
    pullPolicy: IfNotPresent

  replicas: 1

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

  # The scheduler exposes readiness via its admin HTTP port rather than
  # the gRPC ports — a plain TCP check against 7982 is enough to confirm
  # the process is up and serving.
  probes:
    enabled: true
    port: 7982
    initialDelaySeconds: 5
    periodSeconds: 10

  ingress:
    # Off by default — upstream's raw manifest hardcodes
    # bb-scheduler.example.com, which isn't meaningful outside their own
    # docs setup. Set enabled=true and pick a real host + ingressClassName
    # for an actual cluster.
    enabled: false
    host: bb-scheduler.example.com
    ingressClassName: ""

worker:
  # This is the "ubuntu22-04" worker pool from upstream's raw manifest —
  # a single instance/platform for now. Multi-platform support (separate
  # worker pools per OS/toolchain) would mean templating this whole block
  # over a list; not done here, matches upstream's current single-instance
  # scope.
  replicas: 8

  image:
    repository: ghcr.io/buildbarn/bb-worker
    tag: "20260527T162223Z-c48dcda"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

  # bb-worker needs no special securityContext in upstream's manifest
  # (unlike the runner sidecar below) — left at K8s defaults rather than
  # forcing non-root, since it wasn't verified whether the worker binary
  # needs elevated permissions to manage build execution.

  runnerInstaller:
    image:
      repository: ghcr.io/buildbarn/bb-runner-installer
      tag: "20260527T162223Z-c48dcda"
      pullPolicy: IfNotPresent

  runner:
    image:
      repository: ghcr.io/catthehacker/ubuntu
      # Tag + digest combined, matching upstream's pinned reference.
      tag: "act-22.04@sha256:dd7654ffb01d5b7b54b23b9ce928a1f7f2d08c7b3d7e320b6574b55d7ccde78b"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    securityContext:
      runAsUser: 65534
      allowPrivilegeEscalation: false

  concurrency: 8
  inputDownloadConcurrency: 10
  outputUploadConcurrency: 11
  cache:
    maximumFileCount: 10000
    maximumSizeBytes: 1073741824 # 1 GiB

postgres:
  # Upstream's raw manifest runs this as a bare Deployment with no volume
  # at all -- data is lost on every pod restart. This chart makes it a
  # StatefulSet with a real PVC instead, matching bb-storage's pattern.
  image:
    repository: docker.io/postgres
    tag: "18-alpine"
    pullPolicy: IfNotPresent

  database: app
  user: app
  # Read into a Secret rather than left as a bare env var (upstream's raw
  # manifest sets POSTGRES_PASSWORD directly in the Deployment spec, which
  # ends up in plaintext in `kubectl get deploy -o yaml`). This default is
  # only safe for local kind testing -- override via
  # `--set postgres.password=...` or a values file for anything real.
  # Set existingSecret instead to point at a pre-created Secret (key:
  # "password") and skip having this chart manage the secret at all.
  password: "password"
  existingSecret: ""

  storageClassName: ""
  pvcSizeGi: 5

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  securityContext:
    runAsNonRoot: true
    runAsUser: 999 # matches the postgres:18-alpine image's own "postgres" uid
    runAsGroup: 999
    fsGroup: 999
    allowPrivilegeEscalation: false

  # pg_isready is bundled in the postgres image -- a real readiness check,
  # not just "is the TCP port open" (which postgres accepts before it's
  # actually ready to serve).
  probes:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10

portal:
  image:
    repository: ghcr.io/buildbarn/bb-portal
    tag: "20260630T071618Z-dd0997c"
    pullPolicy: IfNotPresent

  replicas: 3

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

  probes:
    enabled: true
    port: 8081
    initialDelaySeconds: 5
    periodSeconds: 10

  # The web UI's displayed name -- upstream's raw manifest hardcodes
  # "Example Co".
  companyName: "Example Co"

  service:
    # portal-bes is the build-event-service gRPC endpoint Bazel clients
    # point --bes_backend at. LoadBalancer matches upstream (external
    # entrypoint); Pending forever on kind with no cloud LB controller,
    # same caveat as frontend's service.
    besType: LoadBalancer

  ingress:
    # Off by default, same reasoning as scheduler's -- upstream hardcodes
    # bb-portal.example.com, not meaningful outside their own docs setup.
    enabled: false
    host: bb-portal.example.com
    ingressClassName: ""

# OIDC/JWT authentication. Off by default -- every component ships with
# authenticationPolicy: { allow: {} } (no auth at all) until this is
# enabled, which is fine for local kind testing but not for anything
# beyond that.
#
# Buildbarn deliberately does NOT fetch a JWKS directly from an OIDC
# provider at request-validation time (startup-dependency risk if the
# IdP is briefly unavailable, plus unnecessary load on the IdP from
# every storage node). Instead it reads a JWKS from a local file, kept
# fresh by a CronJob running Buildbarn's own sync-jwks-to-configmap
# binary against your provider's JWKS endpoint (e.g. Google's
# `https://www.googleapis.com/oauth2/v3/certs`, or your IdP's
# `<issuer>/.well-known/jwks.json`).
oidc:
  enabled: false

  # Your OIDC provider's JWKS endpoint -- NOT the OIDC discovery
  # document URL. If you only have the discovery URL, fetch it once
  # and use the "jwks_uri" field from that document.
  jwksUrl: "https://www.googleapis.com/oauth2/v3/certs"

  # Required "aud" (audience) claim value. Tokens without a matching
  # audience are rejected. Set this to whatever your IdP issues as the
  # audience for this specific client/application.
  audience: "buildbarn-cluster"

  syncJob:
    image:
      repository: ghcr.io/buildbarn/sync-jwks-to-configmap
      tag: "20260814T085338Z-fffe73b"
      pullPolicy: IfNotPresent
    # How often to refresh the JWKS. Buildbarn's own jwks_file reload
    # is every 300s regardless, so syncing more often than that has no
    # additional effect.
    schedule: "*/15 * * * *"
